<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mazzin admin</title>
<style>
  body { margin: 0; background: #f7f8fa; color: #16181d;
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               Helvetica, Arial, sans-serif;
         display: flex; align-items: center; justify-content: center;
         min-height: 100vh; padding: 20px; }
  form { background: #fff; border: 1px solid #e4e6eb; border-radius: 12px;
         padding: 22px; width: 100%; max-width: 320px; }
  h1 { font-size: 16px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; text-transform: uppercase;
          letter-spacing: .04em; color: #6b7280; margin: 0 0 4px; }
  input[type=text], input[type=password] {
    font: inherit; width: 100%; padding: 9px 10px; margin: 0 0 14px;
    border: 1px solid #e4e6eb; border-radius: 8px; background: #fff;
    color: #16181d;
  }
  button { font: inherit; width: 100%; padding: 10px; border-radius: 8px;
           border: 0; background: #16181d; color: #fff; cursor: pointer; }
  p.error { background: #fdeceb; color: #9b3232; border-radius: 8px;
            padding: 8px 10px; font-size: 13px; margin: 0 0 14px; }
</style>
</head>
<body>
<form method="post" action="{{ url_for('admin.login') }}">
  <h1>Mazzin admin</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username"
         autocapitalize="none" autocorrect="off" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password"
         autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
