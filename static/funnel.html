<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mazzin</title>
<link rel="preload" href="/static/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/static/brand/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/static/brand/mark.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/static/brand/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/brand/icon-512.png">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/static/css/mazzin.css">
</head>
<body>

<main id="app">

  <section id="screen-swipe" class="screen is-active">
    <header class="swipe-top">
      <a class="swipe-brand" href="/"><img src="/static/brand/logo.svg" alt="mazzin" height="20" width="88"></a>
      <div class="progress-row">
        <div class="pips" id="pips" aria-hidden="true"></div>
        <span class="progress-label" id="progress-label"></span>
      </div>
      <div class="lead">
        <p class="subtext" id="swipe-subtext"></p>
      </div>
    </header>

    <div class="stage" id="stage">
      <h1 class="caption" id="swipe-caption"></h1>
      <div class="cards" id="cards"></div>
      <p class="tap-hint" id="tap-hint"><span class="tap-dot" aria-hidden="true"></span>Tap your choice</p>
    </div>
  </section>

  <section id="screen-interstitial" class="screen" aria-live="polite">
    <div class="progress-row">
      <div class="pips" id="mid-pips" aria-hidden="true"></div>
      <span class="progress-label" id="mid-progress-label"></span>
    </div>
    <div class="mid-body">
      <p class="mid-kicker" id="mid-kicker"></p>
      <p class="mid-line" id="mid-line"></p>
      <p class="mid-sub" id="mid-sub"></p>
    </div>
    <button class="mid-cta" id="mid-cta" type="button">Continue</button>
  </section>

  <section id="screen-result" class="screen" aria-live="polite">
    <div id="analyzing" class="analyzing">
      <p class="analyzing-text" id="analyzing-text"></p>
      <div class="dots" id="analyzing-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>

    <div id="result-body" hidden>
      <p class="result-kicker">Your perfect style is</p>
      <h1 class="result-name" id="result-name"></h1>
      <p class="result-match" id="result-match"></p>
      <p class="result-blurb" id="result-blurb"></p>

      <div class="report" id="report"></div>

      <button class="cta" id="cta" type="button"></button>
    </div>
  </section>

  <section id="screen-paywall" class="screen">
    <p class="pay-kicker" id="pay-kicker"></p>
    <h1 class="pay-title" id="paywall-headline"></h1>

    <p class="pay-proof" id="pay-proof" hidden>
      <span class="pay-dots" id="pay-dots" aria-hidden="true"></span>
      <span class="pay-proof-line" id="pay-proof-line"></span>
    </p>

    <ul class="manifest" id="manifest"></ul>
    <p class="pay-anchor" id="pay-anchor"></p>
    <p class="price" id="price"></p>

    <label class="withdrawal">
      <input type="checkbox" id="withdrawal-check">
      <span id="withdrawal-text"></span>
    </label>

    <button class="cta" id="pay-button" type="button" disabled>Pay</button>
    <p class="pay-error" id="pay-error" role="alert" hidden></p>
    <ul class="trust" id="trust"></ul>
    <button class="link-back" id="paywall-back" type="button">Back</button>

    <nav class="legal-links">
      <a href="/terms">Terms</a>
      <a href="/privacy">Privacy</a>
      <a href="/refund">Refunds</a>
    </nav>
  </section>

</main>

<script src="/static/js/engine.js"></script>
</body>
</html>
